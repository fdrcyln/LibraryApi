apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-frontend
  namespace: library-qa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: library-frontend
  template:
    metadata:
      labels:
        app: library-frontend
    spec:
      containers:
        - name: library-frontend
          image: furkandurceylan/library-frontend:k8s-test
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: library-frontend
  namespace: library-qa
spec:
  selector:
    app: library-frontend
  ports:
    - port: 80
      targetPort: 80
